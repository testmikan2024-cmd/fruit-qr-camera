<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>果実QRカメラ v9</title><style>
*{box-sizing:border-box}body{margin:0;background:#111b21;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;text-align:center}header{padding:12px;font-weight:700;font-size:19px}.camera{position:relative;width:min(100vw,480px);aspect-ratio:3/4;margin:auto;background:#000;overflow:hidden}video{width:100%;height:100%;object-fit:cover}#guide{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1.67cm;height:1.67cm;border:2px solid #5de2ef;border-radius:3px;pointer-events:none}#guide.ok{border-color:#55f091}#preview{display:none}#photo{width:min(100vw,480px);display:block;margin:auto}#status{padding:10px;min-height:38px;color:#f4d17c}#details{font-size:12px;color:#b8c7cf;padding:4px 12px;overflow-wrap:anywhere}button{border:0;border-radius:12px;background:#21895b;color:#fff;padding:13px 17px;margin:6px;font-size:16px;font-weight:600}button:disabled{background:#4d565a;color:#adb4b8}#shutter{height:72px;width:72px;border-radius:50%;background:#fff;border:6px solid #9da5a9}#shutter:disabled{background:#5a6165}#actions{display:none}.toggle{font-size:14px;display:block;margin:8px}small{color:#acbac0;display:block;margin:10px}

/* iPhone: keep the shutter visible without vertical scrolling */
html,body{min-height:100%;overscroll-behavior-y:none}
body{min-height:100dvh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
header{flex:none;padding:5px 8px;font-size:16px;line-height:22px}
.camera{flex:none;width:min(100vw,480px,calc((100dvh - 205px - env(safe-area-inset-bottom))*0.75));max-width:100%;aspect-ratio:3/4}
#status{flex:none;padding:5px 8px;min-height:28px;font-size:13px;line-height:18px}
#details{flex:none;padding:2px 8px;font-size:11px;line-height:14px;max-height:30px;overflow:auto}
.toggle{flex:none;margin:3px 0;font-size:12px}
#shutter{flex:none;width:62px;height:62px;margin:4px auto;border-width:5px}
#start{align-self:center;margin:5px}
#actions{flex:none}
#actions button{padding:9px 12px;margin:3px;font-size:14px}
#saveHelp{font-size:11px!important;padding:2px 8px!important}
small{font-size:10px;margin:2px 5px;line-height:13px}
#preview{flex:none;min-height:0;overflow:auto}
#photo{max-height:calc(100dvh - 250px - env(safe-area-inset-bottom));width:auto;max-width:100%;object-fit:contain}
@media(max-height:680px){.camera{width:min(100vw,480px,calc((100dvh - 178px - env(safe-area-inset-bottom))*0.75))}header{padding:2px;font-size:14px}#shutter{height:54px;width:54px;margin:2px auto}small{display:none}}
</style></head><body><header>果実QR撮影カメラ v9</header><div id="camera" class="camera"><video id="video" autoplay muted playsinline></video><div id="guide"></div></div><div id="preview"><img id="photo" alt="撮影した果実"></div><div id="status" aria-live="polite">カメラを起動してください</div><div id="details"></div><label class="toggle"><input type="checkbox" id="diagnostic"> 診断モード（QR位置を問わず認識）</label><button id="start">カメラ起動</button><button id="shutter" disabled aria-label="撮影"></button><div id="actions"><button id="save" disabled>写真アプリに保存</button><button id="openPhoto">画像を大きく開く</button><div id="saveHelp" style="font-size:13px;color:#d7e4e9;padding:5px 12px">「写真アプリに保存」→ 共有メニューの「画像を保存」を選択してください。</div><button id="retry">撮り直す</button><button id="next">次の果実</button></div><small>次の果実ではQRを再認識するとシャッターが有効になります。</small><small>保存画像：480 × 640 px / JPEG　※QR認識には通信が必要</small>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id), video=$('video'), statusEl=$('status'), details=$('details'), guide=$('guide');
let stream=null,token=0,running=false,busy=false,qrId='',last=null,photoBlob=null,photoUrl=null,detector=null,zxing=null,scanTimer=null,watchdog=null,scanCount=0,scanStarted=0;
const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
function setStatus(s){statusEl.textContent=s}
function stop(){running=false;busy=false;clearTimeout(scanTimer);clearInterval(watchdog);watchdog=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null}
function reset(){last=null;qrId='';$('shutter').disabled=true;guide.classList.remove('ok');details.textContent=''}
async function startCamera(){const t=++token;stop();reset();busy=false;scanCount=0;scanStarted=0;detector=null;zxing=null;photoBlob=null;$('camera').style.display='block';$('preview').style.display='none';$('actions').style.display='none';$('shutter').style.display='inline-block';$('start').style.display='none';setStatus('カメラ起動中… 次の果実のQR認識を待っています');try{const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}}});if(t!==token){s.getTracks().forEach(x=>x.stop());return}stream=s;video.srcObject=s;await video.play();if(t!==token)return;detector=null;try{if('BarcodeDetector' in window){const formats=await BarcodeDetector.getSupportedFormats();if(formats.includes('qr_code'))detector=new BarcodeDetector({formats:['qr_code']})}}catch(e){}try{zxing=window.ZXing?new ZXing.BrowserQRCodeReader():null}catch(e){zxing=null}if(!detector&&!window.jsQR&&!zxing)throw Error('QRライブラリの読み込みに失敗しました');running=true;setStatus('QR認識待ち：次の果実のQRを中央に合わせてください');scan(t);watchdog=setInterval(()=>{if(!running||t!==token)return;if(scanStarted&&Date.now()-scanStarted>4500){scanStarted=0;busy=false;zxing=null;clearTimeout(scanTimer);scanTimer=setTimeout(()=>scan(t),50);details.textContent='読み取り処理が停止したため再開しました（ZXingを停止）'}},1500)}catch(e){if(t!==token)return;stop();setStatus('カメラを起動できません: '+e.message);$('start').style.display='inline-block'}}
function cropCanvas(){if(!video.videoWidth)return null;const w=video.videoWidth,h=video.videoHeight,scale=Math.min(1,1600/w);cv.width=Math.round(w*scale);cv.height=Math.round(h*scale);cx.drawImage(video,0,0,cv.width,cv.height);return {canvas:cv,w:cv.width,h:cv.height}}
function regions(base){const {w,h}=base;const side=Math.min(w,h)*0.56;const x=(w-side)/2,y=(h-side)/2;const c=document.createElement('canvas');c.width=960;c.height=960;c.getContext('2d').drawImage(cv,x,y,side,side,0,0,960,960);return [{canvas:cv,x:0,y:0,sx:1,sy:1,label:'全体'},{canvas:c,x,y,sx:side/960,sy:side/960,label:'中央拡大'}]}
function inside(points,w,h){if($('diagnostic').checked)return true;const box=$('camera').getBoundingClientRect(),g=guide.getBoundingClientRect(),factor=Math.max(box.width/w,box.height/h),dx=(box.width-w*factor)/2,dy=(box.height-h*factor)/2;const x=points.reduce((s,p)=>s+p.x,0)/points.length*factor+dx+box.left,y=points.reduce((s,p)=>s+p.y,0)/points.length*factor+dy+box.top;return x>=g.left&&x<=g.right&&y>=g.top&&y<=g.bottom}
function normalizePoints(p,r){return p.map(q=>({x:r.x+q.x*r.sx,y:r.y+q.y*r.sy}))}
async function detect(){const base=cropCanvas();if(!base)return {kind:'none'};let outside=null;for(const r of regions(base)){let hits=[];if(detector){try{const rs=await detector.detect(r.canvas);for(const v of rs)if(v.cornerPoints?.length>=4)hits.push({value:v.rawValue,points:v.cornerPoints,engine:'BarcodeDetector'})}catch(e){}}
if(window.jsQR){try{const ctx=r.canvas.getContext('2d',{willReadFrequently:true}),data=ctx.getImageData(0,0,r.canvas.width,r.canvas.height),v=jsQR(data.data,r.canvas.width,r.canvas.height,{inversionAttempts:'attemptBoth'});if(v)hits.push({value:v.data,points:[v.location.topLeftCorner,v.location.topRightCorner,v.location.bottomRightCorner,v.location.bottomLeftCorner],engine:'jsQR'})}catch(e){}}
if(zxing && scanCount%5===0 && !hits.length){try{const v=await Promise.race([zxing.decodeFromImageUrl(r.canvas.toDataURL('image/png')),new Promise((_,reject)=>setTimeout(()=>reject(new Error('ZXing timeout')),900))]);if(v){const pts=v.getResultPoints?.()||[];if(pts.length>=2){const xs=pts.map(p=>p.getX()),ys=pts.map(p=>p.getY()),minx=Math.min(...xs),maxx=Math.max(...xs),miny=Math.min(...ys),maxy=Math.max(...ys);hits.push({value:v.getText(),points:[{x:minx,y:miny},{x:maxx,y:miny},{x:maxx,y:maxy},{x:minx,y:maxy}],engine:'ZXing'})}}}catch(e){if(e.message==='ZXing timeout')zxing=null}}
for(const hit of hits){const points=normalizePoints(hit.points,r);const item={kind:'found',value:hit.value,engine:hit.engine,region:r.label};if(inside(points,base.w,base.h))return item;outside={...item,kind:'outside'}}}return outside||{kind:'none'}}
async function scan(t){if(!running||t!==token)return;if(busy){scanTimer=setTimeout(()=>scan(t),100);return}busy=true;scanStarted=Date.now();scanCount++;try{const v=await detect();if(t!==token)return;if(v.kind==='found'){last={...v,time:Date.now()};qrId=v.value;$('shutter').disabled=false;guide.classList.add('ok');setStatus('QR認識成功・撮影できます');details.textContent='方式: '+v.engine+' / '+v.region+' / ID: '+v.value}else{last=null;$('shutter').disabled=true;guide.classList.remove('ok');setStatus(v.kind==='outside'?'QRは検出しました。中央の枠に合わせてください':'QR認識待ち：次の果実のQRを映してください（距離・ピント・照明を確認）');details.textContent=v.kind==='outside'?'検出方式: '+v.engine+' / '+v.region:'利用可能: '+[detector&&'BarcodeDetector',window.jsQR&&'jsQR',zxing&&'ZXing'].filter(Boolean).join(' / ')}}catch(e){last=null;$('shutter').disabled=true;setStatus('検出エラー: '+e.message)}finally{if(t===token){busy=false;scanStarted=0}}if(running&&t===token)scanTimer=setTimeout(()=>scan(t),220)}
async function capture(){if(!last||!stream||busy)return;const t=token,expected=last.value;$('shutter').disabled=true;setStatus('QRコードを再確認中…');busy=true;let check;try{check=await detect()}catch(e){check={kind:'none'}}finally{busy=false}if(t!==token)return;if(check.kind!=='found'||check.value!==expected){last=null;guide.classList.remove('ok');setStatus('QRを再認識してください。認識後にシャッターが有効になります');return}const c=document.createElement('canvas');c.width=480;c.height=640;const w=video.videoWidth,h=video.videoHeight,ratio=Math.max(480/w,640/h),sw=480/ratio,sh=640/ratio;c.getContext('2d').drawImage(video,(w-sw)/2,(h-sh)/2,sw,sh,0,0,480,640);qrId=expected;++token;stop();$('camera').style.display='none';$('shutter').style.display='none';$('preview').style.display='block';$('actions').style.display='block';$('save').disabled=true;setStatus('撮影画像：480 × 640 px');c.toBlob(b=>{if(!b){setStatus('画像生成に失敗しました');return}photoBlob=b;if(photoUrl)URL.revokeObjectURL(photoUrl);photoUrl=URL.createObjectURL(b);$('photo').src=photoUrl;$('save').disabled=false},'image/jpeg',.92)}
function filename(){const d=new Date(),stamp=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('')+'_'+[d.getHours(),d.getMinutes(),d.getSeconds()].map(v=>String(v).padStart(2,'0')).join('');return (qrId.replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,60)||'QR')+'_'+stamp+'.jpg'}
function openPhoto(){if(!photoUrl)return;const a=document.createElement('a');a.href=photoUrl;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();setStatus('開いた画像を長押しして「写真に保存」を選んでください')}
async function save(){if(!photoBlob)return;const file=new File([photoBlob],filename(),{type:'image/jpeg'});try{if(navigator.canShare?.({files:[file]})){setStatus('共有メニューから「画像を保存」を選択してください');await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}const a=document.createElement('a');a.href=photoUrl;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setStatus('写真アプリへ保存するには、画像を開いて長押しし「写真に保存」を選んでください')}
$('start').onclick=startCamera;$('shutter').onclick=capture;$('save').onclick=save;$('openPhoto').onclick=openPhoto;$('retry').onclick=startCamera;$('next').onclick=()=>{setStatus('次の果実の撮影を準備しています…');startCamera()};$('diagnostic').onchange=()=>{last=null;$('shutter').disabled=true;guide.classList.remove('ok')};window.addEventListener('pagehide',()=>{++token;stop();if(photoUrl)URL.revokeObjectURL(photoUrl)});
</script></body></html>
